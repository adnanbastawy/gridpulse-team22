name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: sudo apt-get update && sudo apt-get install -y libgomp1
      - run: python -m pip install -r requirements/dev.txt
      - run: python -m pytest -q tests
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d && sleep 40 && curl -fsS http://localhost:8000/health && curl -fsS http://localhost:8501/_stcore/health
      - if: always()
        run: docker compose logs && docker compose down
